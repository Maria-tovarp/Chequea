workflows:
  ios-prepro-unsigned:
    name: Chequea iOS Prepro sin firma
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - chequea_prepro
      flutter: 3.41.9
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Crear configuración Prepro
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          : "${SECRETS_PREPRO_JSON:?Falta SECRETS_PREPRO_JSON}"
          umask 077
          mkdir -p config
          printf '%s\n' "$SECRETS_PREPRO_JSON" > config/secrets.prepro.json
          python3 -c '
          import json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8-sig").strip()
          if not raw.startswith("{"):
              sys.exit("SECRETS_PREPRO_JSON debe contener el JSON completo; revisa el valor en Codemagic.")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit("SECRETS_PREPRO_JSON contiene JSON inválido; revisa comillas, comas y saltos de línea.")
          required = {"CHEQUEA_APP_ENV", "PANAMA_API_KEY", "GUATEMALA_API_KEY", "PANAMA_BASE_URL", "GUATEMALA_BASE_URL"}
          if set(data) != required or data["CHEQUEA_APP_ENV"] != "prepro" or not data["PANAMA_API_KEY"] or not data["PANAMA_BASE_URL"].startswith("https://"):
              sys.exit("SECRETS_PREPRO_JSON tiene campos faltantes o un entorno/URL de Panamá incorrectos.")
          print("Configuración Prepro válida")
          ' config/secrets.prepro.json
      - name: Preparar iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get
          flutter precache --ios
          cd ios
          pod install
      - name: Compilar iOS Prepro
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ios --release --no-codesign --dart-define-from-file=config/secrets.prepro.json
      - name: Crear IPA Prepro sin firma
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/ios/iphoneos"
          test -d Runner.app
          mkdir -p Payload
          cp -R Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload prepro-chequea-unsigned.ipa
          test -f prepro-chequea-unsigned.ipa
    artifacts:
      - build/ios/iphoneos/prepro-chequea-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-prepro-app-store:
    name: Chequea iOS Prepro - App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Chequea Apple Developer
    environment:
      groups:
        - chequea_prepro
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chequea.chequeaApp
      flutter: 3.41.9
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Crear configuracion Prepro
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          : "${SECRETS_PREPRO_JSON:?Falta SECRETS_PREPRO_JSON}"
          umask 077
          mkdir -p config
          printf '%s\n' "$SECRETS_PREPRO_JSON" > config/secrets.prepro.json
          python3 -c '
          import json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8-sig").strip()
          if not raw.startswith("{"):
              sys.exit("SECRETS_PREPRO_JSON debe contener el JSON completo; revisa el valor en Codemagic.")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit("SECRETS_PREPRO_JSON contiene JSON invalido; revisa comillas, comas y saltos de linea.")
          required = {"CHEQUEA_APP_ENV", "PANAMA_API_KEY", "GUATEMALA_API_KEY", "PANAMA_BASE_URL", "GUATEMALA_BASE_URL"}
          if set(data) != required or data["CHEQUEA_APP_ENV"] != "prepro" or not data["PANAMA_API_KEY"] or not data["PANAMA_BASE_URL"].startswith("https://"):
              sys.exit("SECRETS_PREPRO_JSON tiene campos faltantes o un entorno/URL de Panama incorrectos.")
          print("Configuracion Prepro valida")
          ' config/secrets.prepro.json
      - name: Preparar iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get
          flutter precache --ios
          cd ios
          pod install
      - name: Configurar firma de App Store
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles
      - name: Generar IPA Prepro firmado
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=config/secrets.prepro.json
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
