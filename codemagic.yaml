      xcode: 26
      cocoapods: default
    scripts:
      - name: Crear configuración Producción
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          : "${SECRETS_PRODUCTION_JSON:?Falta SECRETS_PRODUCTION_JSON}"
          umask 077
          mkdir -p config
          printf '%s\n' "$SECRETS_PRODUCTION_JSON" > config/secrets.production.json
