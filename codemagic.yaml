workflows:
  ios-unsigned:
    name: CHEQUEA iOS Unsigned
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - chequea_secrets
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create secrets.json
        script: |
          mkdir -p config
          cat > config/secrets.json <<EOF
          {
            "PANAMA_API_KEY": "$PANAMA_API_KEY",
            "GUATEMALA_API_KEY": "$GUATEMALA_API_KEY"
          }
          EOF

          echo "secrets.json created"
          test -s config/secrets.json

      - name: Install CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;

      - name: Build unsigned iOS app
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define-from-file=config/secrets.json

      - name: Verify Runner.app
        script: |
          test -d build/ios/iphoneos/Runner.app
          echo "Runner.app found"

      - name: Package unsigned IPA
        script: |
          rm -rf "$CM_BUILD_DIR/Payload"
          mkdir -p "$CM_BUILD_DIR/Payload"

          cp -R \
            "$CM_BUILD_DIR/build/ios/iphoneos/Runner.app" \
            "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"
          zip -qry chequea-unsigned.ipa Payload

          rm -rf "$CM_BUILD_DIR/Payload"

          echo "Unsigned IPA created:"
          ls -lh "$CM_BUILD_DIR/chequea-unsigned.ipa"

    artifacts:
      - chequea-unsigned.ipa
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log