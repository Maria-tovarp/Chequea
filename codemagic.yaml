      - name: Generar IPA de Producción firmado
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=config/secrets.production.json
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Carga la IPA a App Store Connect con la integración ya configurada.
        # No se envía a TestFlight ni a revisión automáticamente.
        auth: integration
