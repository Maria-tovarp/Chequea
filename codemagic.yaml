workflows:
  ios-prepro-unsigned:
    name: Chequea iOS Prepro sin firma
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - chequea_prepro
      flutter: 3.41.9
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Crear configuración Prepro
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          : "${SECRETS_PREPRO_JSON:?Falta SECRETS_PREPRO_JSON}"
          umask 077
          mkdir -p config
          printf '%s\n' "$SECRETS_PREPRO_JSON" > config/secrets.prepro.json
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); expected={"CHEQUEA_APP_ENV","PANAMA_API_KEY","GUATEMALA_API_KEY","PANAMA_BASE_URL","GUATEMALA_BASE_URL"}; assert set(d)==expected and d["CHEQUEA_APP_ENV"]=="prepro" and d["PANAMA_API_KEY"] and d["PANAMA_BASE_URL"].startswith("https://"), "Configuración Prepro inválida"' config/secrets.prepro.json
      - name: Preparar iOS
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter pub get
          flutter precache --ios
          cd ios
          pod install
      - name: Compilar iOS Prepro
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter build ios --release --no-codesign --dart-define-from-file=config/secrets.prepro.json
      - name: Crear IPA Prepro sin firma
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/ios/iphoneos"
          test -d Runner.app
          mkdir -p Payload
          cp -R Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload prepro-chequea-unsigned.ipa
          test -f prepro-chequea-unsigned.ipa
    artifacts:
      - build/ios/iphoneos/prepro-chequea-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-production-unsigned:
